<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira's games</title>
<style>
  :root { --bg: #0e0c12; --plate: #17141d; --pink: #ff2a6d; --cyan: #05d9e8; --text: #ecebf2; --dim: #8d8a99;
          --light: #e8e3d6; --dark: #6d5a8a; --lit: rgba(255, 42, 109, .45); --dot: rgba(5, 217, 232, .65); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Share Tech Mono", Consolas, "DejaVu Sans Mono", monospace;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 18px; letter-spacing: .2em; margin: 4px 0 12px; background: linear-gradient(90deg, var(--pink), var(--cyan));
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  nav button, .bar button, .bar select { background: var(--plate); color: var(--text); border: 1px solid #3a3446; padding: 6px 12px;
       font: inherit; cursor: pointer; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  nav button.on { border-color: var(--pink); color: var(--pink); }
  .bar { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
  .say { min-height: 22px; color: var(--cyan); text-align: center; margin: 6px 0; }
  .score { color: var(--dim); }
  section { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 640px; }
  section.on { display: flex; }
  .board { display: grid; border: 2px solid; border-image: linear-gradient(135deg, var(--pink), var(--cyan)) 1; user-select: none; }
  #chess .board { grid-template-columns: repeat(8, min(9.5vw, 64px)); }
  #chess .sq { width: min(9.5vw, 64px); height: min(9.5vw, 64px); display: flex; align-items: center; justify-content: center;
               font-size: min(7.4vw, 48px); cursor: pointer; position: relative; line-height: 1; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.sel { box-shadow: inset 0 0 0 3px var(--pink); }
  .sq.last { background-image: linear-gradient(var(--lit), var(--lit)); }
  .sq.dest::after { content: ""; width: 26%; height: 26%; border-radius: 50%; background: var(--dot); position: absolute; }
  .w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 1px 2px #000; } .b { color: #111; text-shadow: 0 0 2px #fff8; }
  .moves { color: var(--dim); max-width: 560px; text-align: center; min-height: 20px; word-spacing: 3px; }
  #tictactoe .board { grid-template-columns: repeat(3, 96px); gap: 4px; background: #3a3446; }
  #tictactoe .cell { width: 96px; height: 96px; background: var(--plate); display: flex; align-items: center; justify-content: center;
               font-size: 54px; cursor: pointer; }
  #connect4 .board { grid-template-columns: repeat(7, 58px); gap: 6px; padding: 8px; background: #1d1830; }
  #connect4 .cell { width: 58px; height: 58px; border-radius: 50%; background: var(--bg); cursor: pointer; }
  .x, .p1 { color: var(--pink); } .o, .p2 { color: var(--cyan); }
  #connect4 .cell.p1 { background: var(--pink); box-shadow: 0 0 12px var(--pink); } #connect4 .cell.p2 { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .hands { display: flex; gap: 14px; margin: 16px 0; }
  .hands button { font-size: 44px; width: 96px; height: 96px; background: var(--plate); border: 1px solid #3a3446; cursor: pointer; color: var(--text); }
  .throws { font-size: 54px; display: flex; gap: 40px; min-height: 70px; align-items: center; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 12px; text-align: center; }
  .group { width: 100%; max-width: 520px; background: var(--plate); border: 1px solid #3a3446; padding: 10px 16px; margin: 6px 0;
           clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .group h2 { font-size: 12px; letter-spacing: .25em; color: var(--pink); margin: 4px 0 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 12px; cursor: pointer; }
  .row small { display: block; color: var(--dim); font-size: 11px; }
  .row input { accent-color: var(--pink); width: 18px; height: 18px; }
  .row select { background: var(--bg); color: var(--text); border: 1px solid #3a3446; font: inherit; padding: 3px 6px; }
</style>
</head>
<body>
<h1>M I R A · G A M E S</h1>
<nav>
  <button data-game="chess">CHESS</button><button data-game="tictactoe">TIC-TAC-TOE</button>
  <button data-game="connect4">CONNECT FOUR</button><button data-game="rps">ROCK PAPER SCISSORS</button>
  <button data-game="settings">SETTINGS</button>
</nav>

<section id="chess">
  <div class="bar">
    <select id="level"><option value="easy">easy</option><option value="medium" selected>medium</option>
      <option value="hard">hard</option><option value="max">full strength</option></select>
    <select id="side"><option value="w">you: White</option><option value="b">you: Black</option></select>
    <button id="chessNew">NEW GAME</button>
  </div>
  <div class="say" id="chessSay"></div>
  <div class="board" id="chessBoard"></div>
  <div class="moves" id="chessMoves"></div>
</section>

<section id="tictactoe">
  <div class="bar"><span class="score" id="tttScore">you 0 · Mira 0 · draws 0</span><button id="tttNew">NEW ROUND</button></div>
  <div class="say" id="tttSay"></div>
  <div class="board" id="tttBoard"></div>
  <div class="hint">1-9 to play · N new round</div>
</section>

<section id="connect4">
  <div class="bar"><span class="score" id="c4Score">you 0 · Mira 0 · draws 0</span><button id="c4New">NEW ROUND</button></div>
  <div class="say" id="c4Say"></div>
  <div class="board" id="c4Board"></div>
  <div class="hint">1-7 to drop · N new round</div>
</section>

<section id="rps">
  <div class="bar"><span class="score" id="rpsScore">you 0 · Mira 0</span><button id="rpsNew">NEW MATCH</button></div>
  <div class="say" id="rpsSay">First to three.</div>
  <div class="throws"><span id="rpsYou"></span><span id="rpsHer"></span></div>
  <div class="hands"><button data-h="r">✊</button><button data-h="p">✋</button><button data-h="s">✌️</button></div>
  <div class="hint">R / P / S · N new match</div>
</section>
<section id="settings">
  <div class="group"><h2>HER</h2>
    <label class="row"><span>Quiet <small>no check-ins or pop-ins; she still answers you</small></span><input type="checkbox" id="setQuiet"></label>
    <label class="row"><span>Coach my chess <small>engine moves on chess.com / lichess vs the computer</small></span><input type="checkbox" id="setCoach"></label>
    <label class="row"><span>Mini player <small>bottom-left while music plays</small></span><input type="checkbox" id="setMini"></label>
    <label class="row"><span>Pop-ins</span><select id="setPopin"><option value="rarely">rarely</option><option value="sometimes">sometimes</option><option value="often">often</option></select></label>
  </div>
  <div class="group"><h2>MOMENTS SHE GETS</h2><div id="setMoments"></div></div>
  <div class="say" id="setSay"></div>
</section>
<div class="hint">Esc closes · Mira sees how it ends</div>

<script>
const token = new URLSearchParams(location.search).get("t");
const api = (path, body) => fetch(path + (path.includes("?") ? "&" : "?") + "t=" + token,
  body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}).then(r => r.json());
const tell = (game, result, score, detail) => api("/api/result", { game, result, score, detail }).catch(() => {});
const $ = id => document.getElementById(id);

// ---- tabs
let current = "";
function show(game) {
  if (!["chess", "tictactoe", "connect4", "rps", "settings"].includes(game)) game = "chess";
  if (game === "settings") loadSettings();
  current = game;
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === game));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.game === game));
  history.replaceState(null, "", "#" + game);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.game));

// ---- chess: the server's Stockfish knows the rules and plays her moves
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
let chess = { fen: "", legal: [], sel: null, last: [], you: "w", over: true, moves: [], busy: false };
function squares(fen) {
  const out = {}; const rows = fen.split(" ")[0].split("/");
  rows.forEach((row, r) => { let f = 0; for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { out["abcdefgh"[f] + (8 - r)] = ch; f++; } } });
  return out;
}
function drawChess() {
  const board = $("chessBoard"), pieces = squares(chess.fen); board.innerHTML = "";
  const ranks = chess.you === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const files = chess.you === "w" ? "abcdefgh" : "hgfedcba";
  const dests = chess.sel ? chess.legal.filter(m => m.slice(0, 2) === chess.sel).map(m => m.slice(2, 4)) : [];
  for (const r of ranks) for (const f of files) {
    const name = f + r, d = document.createElement("div"), p = pieces[name];
    d.className = "sq " + (("abcdefgh".indexOf(f) + r) % 2 ? "d" : "l") + (chess.sel === name ? " sel" : "")
      + (chess.last.includes(name) ? " last" : "") + (dests.includes(name) ? " dest" : "");
    if (p) { const s = document.createElement("span"); s.className = p === p.toUpperCase() ? "w" : "b"; s.textContent = GLYPH[p.toLowerCase()]; d.appendChild(s); }
    d.onclick = () => clickSquare(name, p);
    board.appendChild(d);
  }
  $("chessMoves").textContent = chess.moves.join("  ");
}
function mine(p) { return p && (chess.you === "w" ? p === p.toUpperCase() : p === p.toLowerCase()); }
function clickSquare(name, piece) {
  if (chess.over || chess.busy || chess.fen.split(" ")[1] !== chess.you) return;
  if (mine(piece)) { chess.sel = chess.sel === name ? null : name; return drawChess(); }
  if (!chess.sel) return;
  let move = chess.legal.find(m => m.slice(0, 4) === chess.sel + name && (m.length === 4 || m[4] === "q"));
  chess.sel = null;
  if (!move) return drawChess();
  chess.busy = true; $("chessSay").textContent = "…";
  api("/api/chess/move", { fen: chess.fen, move, level: $("level").value }).then(r => {
    chess.busy = false;
    if (r.error) { $("chessSay").textContent = r.error; return; }
    chess.moves.push(r.mine); chess.last = [move.slice(0, 2), move.slice(2, 4)];
    if (r.hers) { chess.moves.push(r.hers_text); chess.last = [r.hers.slice(0, 2), r.hers.slice(2, 4)]; }
    chess.fen = r.fen; chess.legal = r.legal || [];
    $("chessSay").textContent = r.hers ? "Mira: " + r.hers_text : "";
    endCheck(r.status);
    drawChess();
  }).catch(() => { chess.busy = false; $("chessSay").textContent = "lost the board connection"; });
}
function endCheck(status) {
  if (status === "play") return;
  chess.over = true;
  const toMove = chess.fen.split(" ")[1];
  const result = status === "stalemate" ? "draw" : (toMove === chess.you ? "loss" : "win");
  $("chessSay").textContent = status === "stalemate" ? "Stalemate." : (result === "win" ? "Checkmate - you win." : "Checkmate - Mira wins.");
  tell("chess", result, "", `${$("level").selectedOptions[0].text} level, ${chess.moves.length} plies: ${chess.moves.slice(-6).join(" ")}`);
}
function newChess() {
  chess = { fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", legal: [], sel: null, last: [],
            you: $("side").value, over: false, moves: [], busy: true };
  $("chessSay").textContent = "…";
  drawChess();
  api(`/api/chess/new?color=${chess.you}&level=${$("level").value}`).then(r => {
    chess.busy = false;
    if (r.error) { $("chessSay").textContent = r.error; chess.over = true; return; }
    chess.fen = r.fen; chess.legal = r.legal;
    if (r.hers) { chess.moves.push(r.hers_text); chess.last = [r.hers.slice(0, 2), r.hers.slice(2, 4)]; }
    $("chessSay").textContent = r.hers ? "Mira: " + r.hers_text : "Your move.";
    drawChess();
  });
}
$("chessNew").onclick = newChess;

// ---- tic-tac-toe: minimax, with slips on purpose so she's beatable sometimes
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let ttt = { b: Array(9).fill(""), over: false, score: [0, 0, 0], first: "x" };
function tttWinner(b) { for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return b.every(Boolean) ? "draw" : ""; }
function minimax(b, me) {
  const w = tttWinner(b); if (w === "o") return { s: 1 }; if (w === "x") return { s: -1 }; if (w === "draw") return { s: 0 };
  let best = { s: me ? -2 : 2 };
  b.forEach((v, i) => { if (v) return; b[i] = me ? "o" : "x"; const s = minimax(b, !me).s; b[i] = "";
    if (me ? s > best.s : s < best.s) best = { s, i }; });
  return best;
}
function tttHer() {
  const free = ttt.b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const i = Math.random() < 0.18 ? free[Math.floor(Math.random() * free.length)] : minimax(ttt.b, true).i;
  ttt.b[i] = "o";
}
function tttDraw() {
  const el = $("tttBoard"); el.innerHTML = "";
  ttt.b.forEach((v, i) => { const c = document.createElement("div"); c.className = "cell " + v; c.textContent = v ? (v === "x" ? "✕" : "◯") : ""; c.onclick = () => tttPlay(i); el.appendChild(c); });
  $("tttScore").textContent = `you ${ttt.score[0]} · Mira ${ttt.score[1]} · draws ${ttt.score[2]}`;
}
function tttEnd() {
  const w = tttWinner(ttt.b); if (!w) return false;
  ttt.over = true; const k = w === "x" ? 0 : w === "o" ? 1 : 2; ttt.score[k]++;
  $("tttSay").textContent = ["You win.", "Mira wins.", "Draw."][k];
  tell("tictactoe", ["win", "loss", "draw"][k], `you ${ttt.score[0]}, Mira ${ttt.score[1]}, draws ${ttt.score[2]}`);
  return true;
}
function tttPlay(i) { if (ttt.over || ttt.b[i]) return; ttt.b[i] = "x"; if (!tttEnd()) { tttHer(); tttEnd(); } tttDraw(); }
function tttNew() { ttt.b = Array(9).fill(""); ttt.over = false; ttt.first = ttt.first === "x" ? "o" : "x"; $("tttSay").textContent = ttt.first === "x" ? "You start." : "Mira starts.";
  if (ttt.first === "o") tttHer(); tttDraw(); }
$("tttNew").onclick = tttNew;

// ---- connect four: alpha-beta a few plies deep
const R = 6, C = 7;
let c4 = { b: [], over: false, score: [0, 0, 0] };
function c4Drop(b, col, p) { for (let r = R - 1; r >= 0; r--) if (!b[r][col]) { b[r][col] = p; return r; } return -1; }
function c4Win(b, p) {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let k = 0; for (; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= R || cc < 0 || cc >= C || b[rr][cc] !== p) break; }
    if (k === 4) return true; }
  return false;
}
function c4Score(b) {
  let s = 0;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let me = 0, you = 0, ok = true;
    for (let k = 0; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= R || cc < 0 || cc >= C) { ok = false; break; }
      if (b[rr][cc] === 2) me++; else if (b[rr][cc] === 1) you++; }
    if (!ok || (me && you)) continue;
    s += [0, 1, 5, 40, 0][me] - [0, 1, 6, 50, 0][you];
  }
  return s + b.reduce((a, row) => a + (row[3] === 2 ? 3 : 0), 0);
}
function c4Search(b, depth, alpha, beta, me) {
  if (c4Win(b, 2)) return 100000 + depth; if (c4Win(b, 1)) return -100000 - depth;
  const cols = [3, 2, 4, 1, 5, 0, 6].filter(c => !b[0][c]);
  if (!depth || !cols.length) return c4Score(b);
  for (const c of cols) { const r = c4Drop(b, c, me ? 2 : 1); const s = c4Search(b, depth - 1, alpha, beta, !me); b[r][c] = 0;
    if (me) alpha = Math.max(alpha, s); else beta = Math.min(beta, s); if (alpha >= beta) break; }
  return me ? alpha : beta;
}
function c4Her() {
  let best = -Infinity, pick = 3;
  for (const c of [3, 2, 4, 1, 5, 0, 6].filter(c => !c4.b[0][c])) {
    const r = c4Drop(c4.b, c, 2); const s = c4Search(c4.b, 5, -Infinity, Infinity, false) + Math.random() * 4; c4.b[r][c] = 0;
    if (s > best) { best = s; pick = c; } }
  c4Drop(c4.b, pick, 2);
}
function c4DrawBoard() {
  const el = $("c4Board"); el.innerHTML = "";
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const d = document.createElement("div"); d.className = "cell" + (c4.b[r][c] ? " p" + c4.b[r][c] : ""); d.onclick = () => c4Play(c); el.appendChild(d); }
  $("c4Score").textContent = `you ${c4.score[0]} · Mira ${c4.score[1]} · draws ${c4.score[2]}`;
}
function c4End() {
  const k = c4Win(c4.b, 1) ? 0 : c4Win(c4.b, 2) ? 1 : c4.b[0].every(Boolean) ? 2 : -1;
  if (k < 0) return false;
  c4.over = true; c4.score[k]++; $("c4Say").textContent = ["You win.", "Mira wins.", "Draw."][k];
  tell("connect4", ["win", "loss", "draw"][k], `you ${c4.score[0]}, Mira ${c4.score[1]}, draws ${c4.score[2]}`);
  return true;
}
function c4Play(c) { if (c4.over || c4.b[0][c]) return; c4Drop(c4.b, c, 1); if (!c4End()) { c4Her(); c4End(); } c4DrawBoard(); }
function c4New() { c4.b = Array.from({ length: R }, () => Array(C).fill(0)); c4.over = false; $("c4Say").textContent = "Your drop."; c4DrawBoard(); }
$("c4New").onclick = c4New;

// ---- rock paper scissors: first to three; she learns what you throw after what
const HAND = { r: "✊", p: "✋", s: "✌️" }, BEATS = { r: "s", p: "r", s: "p" }, COUNTER = { r: "p", p: "s", s: "r" };
let rps = { score: [0, 0], seen: {}, last: "", over: false };
function rpsHer() {
  const next = rps.seen[rps.last] || {}; const guess = Object.keys(next).sort((a, b) => next[b] - next[a])[0];
  return guess && Math.random() < 0.6 ? COUNTER[guess] : "rps"[Math.floor(Math.random() * 3)];
}
function rpsPlay(h) {
  if (rps.over) return;
  const her = rpsHer();
  if (rps.last) { rps.seen[rps.last] = rps.seen[rps.last] || {}; rps.seen[rps.last][h] = (rps.seen[rps.last][h] || 0) + 1; }
  rps.last = h;
  $("rpsYou").textContent = HAND[h]; $("rpsHer").textContent = HAND[her];
  if (h === her) $("rpsSay").textContent = "Same. Again.";
  else if (BEATS[h] === her) { rps.score[0]++; $("rpsSay").textContent = "Point to you."; }
  else { rps.score[1]++; $("rpsSay").textContent = "Point to Mira."; }
  $("rpsScore").textContent = `you ${rps.score[0]} · Mira ${rps.score[1]}`;
  if (Math.max(...rps.score) >= 3) {
    rps.over = true; const won = rps.score[0] >= 3;
    $("rpsSay").textContent = won ? "You take the match." : "Mira takes the match.";
    tell("rps", won ? "win" : "loss", `${rps.score[0]}-${rps.score[1]}`);
  }
}
function rpsNew() { rps.score = [0, 0]; rps.over = false; $("rpsSay").textContent = "First to three."; $("rpsYou").textContent = $("rpsHer").textContent = ""; $("rpsScore").textContent = "you 0 · Mira 0"; }
document.querySelectorAll(".hands button").forEach(b => b.onclick = () => rpsPlay(b.dataset.h));
$("rpsNew").onclick = rpsNew;

// ---- settings: written straight to her companion, applied at once
function applySettings(s) {
  $("setQuiet").checked = s.quiet; $("setCoach").checked = s.coach; $("setMini").checked = s.mini_player;
  $("setCoach").disabled = !s.engine; $("setPopin").value = s.popin;
  const box = $("setMoments"); box.innerHTML = "";
  for (const [k, label] of Object.entries(s.moments)) {
    const row = document.createElement("label"); row.className = "row";
    row.innerHTML = `<span>${label}</span><input type="checkbox" data-k="${k}" ${s.off.includes(k) ? "" : "checked"}>`;
    row.querySelector("input").onchange = saveMoments;
    box.appendChild(row);
  }
}
function saveMoments() {
  const off = [...document.querySelectorAll("#setMoments input")].filter(i => !i.checked).map(i => i.dataset.k);
  change({ off });
}
function change(body) { api("/api/settings", body).then(s => { applySettings(s); $("setSay").textContent = "saved"; setTimeout(() => $("setSay").textContent = "", 1200); }); }
function loadSettings() { api("/api/settings").then(applySettings).catch(() => {}); }
$("setQuiet").onchange = e => change({ quiet: e.target.checked });
$("setCoach").onchange = e => change({ coach: e.target.checked });
$("setMini").onchange = e => change({ mini_player: e.target.checked });
$("setPopin").onchange = e => change({ popin: e.target.value });

// ---- keys
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return window.close();
  const k = e.key.toLowerCase();
  if (current === "tictactoe" && /^[1-9]$/.test(k)) tttPlay(+k - 1);
  if (current === "connect4" && /^[1-7]$/.test(k)) c4Play(+k - 1);
  if (current === "rps" && "rps".includes(k) && k.length === 1) rpsPlay(k);
  if (k === "n" && current !== "settings") ({ chess: newChess, tictactoe: tttNew, connect4: c4New, rps: rpsNew })[current]();
});

show(location.hash.slice(1));
tttNew(); c4New(); newChess();
</script>
</body>
</html>
