# ARGUS - starting configuration. argus/install.sh copies this to $ARGUS_HOME/config.yaml ONCE, when there is
# none; after that the file is yours and is never overwritten (`argus config` / `argus setup` edit it too).
# Keys are the Hermes config schema (cli-config.yaml.example in the repo root has every option).

model:
  # Picked from whatever credentials $ARGUS_HOME/.env holds until you choose one with `argus model`.
  # HavoK's laphvk config (2026-10-31, every model below live-tested for tool calling):
  #   provider: "nvidia"
  #   default: "minimaxai/minimax-m3.1-flash"        # NIM free tier, ~4 s, strong agentic model
  provider: "auto"

# Cloudflare Workers AI as a named OpenAI-compatible provider. The account id is an identifier, not a secret,
# but it is per-account, so it is written here in YOUR config rather than in the repo.
# providers:
#   cloudflare:
#     base_url: "https://api.cloudflare.com/client/v4/accounts/<CLOUDFLARE_ACCOUNT_ID>/ai/v1"
#     key_env: CLOUDFLARE_API_TOKEN

# The fallback chain HavoK runs (format: website/docs/user-guide/features/fallback-providers.md). Free-plan
# availability as tested 2026-10-31 - Cloudflare's paid-only models (GLM-5.3, Kimi K2.7, DeepSeek V4) answer 403,
# Z.ai answers "Insufficient balance" until the account has credit (then glm-5.3 belongs at the top).
# fallback_providers:
#   - provider: cloudflare
#     model: "@cf/openai/gpt-oss-120b"                # 0.7 s
#   - provider: nvidia
#     model: "mistralai/mistral-large-4-1t-a52b"      # 1T params, ~14 s - the heavyweight
#   - provider: cloudflare
#     model: "@cf/nvidia/nemotron-3-120b-a12b"        # 0.8 s
#   - provider: cloudflare
#     model: "@cf/qwen/qwen3.8-27b"                   # 1.4 s

mcp_servers:
  # MIRA's own MCP (mira-mcp on debhvk): every tool MIRA has - phone, PCs, TV, music, calendar, vault, estate.
  # Through the Cloudflare relay with MIRA's MCP token, from anywhere. Not the LAN: mira-mcp's LAN guard
  # (2026-10-27) only lets loopback and the Docker networks reach /mcp, because the tools include ssh_exec and
  # PC control and the LAN is not a credential. Put the token in $ARGUS_HOME/.env as JARVIS_MCP_TOKEN
  # (value: JARVIS_MCP_TOKEN in debhvk:/srv/authentik-prod/config/.env.jarvis - see MCP-CLOUD-SETUP.md).
  mira:
    url: "https://jarvis-mcp-relay.moonauth.dpdns.org/mcp"
    headers:
      Authorization: "Bearer ${MIRA_MCP_TOKEN}"
    timeout: 120
    connect_timeout: 20

skills:
  # MIRA's skills, read-only (ARGUS writes its own new skills into $ARGUS_HOME/skills).
  external_dirs:
    - ~/.argus/mira-skills

display:
  skin: argus
  # The Ink TUI by default (Hermes defaults to its classic prompt_toolkit CLI); `argus --cli` still opens that.
  # The TUI attaches to the profile's one long-lived core server (`argus gateway`), the same one Desktop uses.
  interface: tui

# ARGUS sees HavoK's whole estate: no usage metrics go to Nous, and the first-run question is answered here
# ("decided" needs enabled/send recorded at the current offer_version - hermes_cli/observability/
# shared_metrics_consent.py; if upstream bumps OFFER_VERSION it asks once more).
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
